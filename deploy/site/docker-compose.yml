services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    networks:
      - internal
      - proxy_network
    # Routing/TLS for dev.benardkimani.co.ke is owned by the Traefik file-provider
    # config at deploy/site/goolang.yml (deployed to the host's Traefik dynamic dir) —
    # no docker-label router here to avoid two routers competing for the same Host rule.
    healthcheck:
      # 127.0.0.1, not localhost: nginx only listens on IPv4 and some images resolve
      # "localhost" to ::1 first, which wget doesn't fall back from — see go-server below.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  go-server:
    build:
      context: ../../
      dockerfile: deploy/site/Dockerfile.server
    restart: unless-stopped
    networks:
      - internal
    environment:
      - APP_ENV=production
      - APP_DEFAULT_LOG_LEVEL=info
      - APP_JSON_LOGS=true
      - APP_DATABASE_DSN=/app/data/app.db
    volumes:
      - goolang-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  goolang-data:

networks:
  internal:
    driver: bridge
  proxy_network:
    external: true
